services:
  # icw.rocketmq.namesrv 服务
  icw-rocketmq-namesrv:
    image: apache/rocketmq:5.3.2
    container_name: icw.rocketmq.namesrv
    restart: unless-stopped
    ports:
      - 9876:9876
    networks:
      - icw-docker-network
    command: sh mqnamesrv

  # icw.rocketmq.broker 服务
  icw-rocketmq-broker:
    image: apache/rocketmq:5.3.2
    container_name: icw.rocketmq.broker
    restart: unless-stopped
    depends_on:
      - icw-rocketmq-namesrv
    ports:
      - 10909:10909
      - 10911:10911
    networks:
      - icw-docker-network
    command: |
      sh -c 'cat > /tmp/broker.conf <<EOF
      brokerClusterName=ICW_ROCKETMQ_CLUSTER
      brokerName=ICW_ROCKETMQ_BROKER
      brokerId=0
      namesrvAddr=icw-rocketmq-namesrv:9876
      brokerIP1=47.76.71.221
      listenPort=10911
      EOF
      exec sh mqbroker -c /tmp/broker.conf'
    healthcheck:
      test: ["CMD-SHELL", "sh mqadmin clusterList -n icw-rocketmq-namesrv:9876 >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  # icw.rocketmq.init 服务
  icw-rocketmq-init:
    image: apache/rocketmq:5.3.2
    container_name: icw.rocketmq.init
    depends_on:
      icw-rocketmq-broker:
        condition: service_healthy
    networks:
      - icw-docker-network
    command: >
      sh -c "sh mqadmin updateTopic -n icw-rocketmq-namesrv:9876 -b icw-rocketmq-broker:10911 -t ICW_PROJECT_EVENT"

  # icw.activity.classification 服务
  icw-activity-classification:
    image: minmuslin/icw_activity_classification:latest
    container_name: icw.activity.classification
    restart: unless-stopped
    environment:
      ICW_ACTIVITY_CLASSIFICATION_ADDR: 0.0.0.0:8002
      ICW_CORE_BIZ_ADDR: icw-core-biz:8001
      CLASSIFICATION_TASK_MAX_CONCURRENCY: 20
      AGENT_SECRET_TOKEN: pat_uG4j4COtVZQF9jb7uBY47n6EUnhWOMB3mEwHFOruzOdT9p7w81SmzMYjhX6HgV5p
      AGENT_BOT_ID: 7633469965525614634
      AGENT_USER_ID: icw_activity_classification
      AGENT_IMAGE_SIZE: 512
      AGENT_REQUEST_TIMEOUT_MINUTES: 5
    depends_on:
      icw-rocketmq-init:
        condition: service_completed_successfully
    networks:
      - icw-docker-network

  # icw.activity.reasoning 服务
  icw-activity-reasoning:
    image: minmuslin/icw_activity_reasoning:latest
    container_name: icw.activity.reasoning
    restart: unless-stopped
    environment:
      ICW_ACTIVITY_REASONING_ADDR: 0.0.0.0:8003
      ICW_CORE_BIZ_ADDR: icw-core-biz:8001
      REASONING_MODEL_DIR: /app/models
      REASONING_RUNTIME_DIR: /app/.runtime
      REASONING_TASK_MAX_CONCURRENCY: 20
      REASONING_TASK_TIMEOUT_MINUTES: 30
      ARTIFACT_DOWNLOAD_TIMEOUT_MINUTES: 5
      ARTIFACT_UPLOAD_TIMEOUT_MINUTES: 10
    depends_on:
      icw-rocketmq-init:
        condition: service_completed_successfully
    networks:
      - icw-docker-network
    volumes:
      - /root/models:/app/models:ro

  # icw.activity.summary 服务
  icw-activity-summary:
    image: minmuslin/icw_activity_summary:latest
    container_name: icw.activity.summary
    restart: unless-stopped
    environment:
      ICW_ACTIVITY_SUMMARY_ADDR: 0.0.0.0:8004
      ICW_CORE_BIZ_ADDR: icw-core-biz:8001
      DETECTION_SUMMARY_TASK_MAX_CONCURRENCY: 20
      DETECTION_SUMMARY_AGENT_SECRET_TOKEN: pat_uG4j4COtVZQF9jb7uBY47n6EUnhWOMB3mEwHFOruzOdT9p7w81SmzMYjhX6HgV5p
      DETECTION_SUMMARY_AGENT_BOT_ID: 7637717111535730723
      DETECTION_SUMMARY_AGENT_USER_ID: icw_activity_summary
      PROJECT_SUMMARY_TASK_MAX_CONCURRENCY: 20
      PROJECT_SUMMARY_AGENT_SECRET_TOKEN: pat_uG4j4COtVZQF9jb7uBY47n6EUnhWOMB3mEwHFOruzOdT9p7w81SmzMYjhX6HgV5p
      PROJECT_SUMMARY_AGENT_BOT_ID: 7637717197741342726
      PROJECT_SUMMARY_AGENT_USER_ID: icw_activity_summary
      AGENT_REQUEST_TIMEOUT_MINUTES: 5
    depends_on:
      icw-rocketmq-init:
        condition: service_completed_successfully
    networks:
      - icw-docker-network

  # icw.activity.biz 服务
  icw-core-biz:
    image: minmuslin/icw_core_biz:latest
    container_name: icw.core.biz
    restart: unless-stopped
    environment:
      ICW_CORE_BIZ_ADDR: 0.0.0.0:8001
      ICW_ACTIVITY_CLASSIFICATION_ADDR: icw-activity-classification:8002
      ICW_ACTIVITY_REASONING_ADDR: icw-activity-reasoning:8003
      ICW_ACTIVITY_SUMMARY_ADDR: icw-activity-summary:8004
      MYSQL_USERNAME: mysql-user
      MYSQL_PASSWORD: mysql-2250758
      MYSQL_ADDR: 47.76.71.221:3306
      MYSQL_DATABASE: icw_data_mysql
      REDIS_ADDR: 47.76.71.221:6379
      REDIS_PASSWORD: redis-2250758
      REDIS_DB: 0
      SMTP_HOST: smtpdm.aliyun.com
      SMTP_PORT: 465
      SMTP_PASSWORD: M7nB9cV3xZ1lK4jH
      SMTP_FROM_NAME: 建筑幕墙韧性评估软件系统
      SMTP_FROM_EMAIL: noreply@mail.minmuslin.cn
      MINIO_ENDPOINT: http://47.76.71.221:9000
      MINIO_ACCESS_KEY: minio-user
      MINIO_ACCESS_SECRET: minio-2250758
      MINIO_BUCKET: icw.data.minio
      ROCKETMQ_NAMESRV_ADDR: 47.76.71.221:9876
      ROCKETMQ_PROJECT_EVENT_TOPIC: ICW_PROJECT_EVENT
      JWT_SECRET: icw-jwt-secret
      EMAIL_CODE_SECRET: icw-email-code-secret
      EMAIL_CODE_TTL_MINUTES: 1
      LOGIN_FAIL_TTL_MINUTES: 10
      ACCESS_TOKEN_TTL_MINUTES: 10
      REFRESH_TOKEN_TTL_MINUTES: 480
      AVATAR_GET_TTL_MINUTES: 480
      AVATAR_UPLOAD_TTL_MINUTES: 1
      PROJECT_IMAGE_GET_TTL_MINUTES: 60
      PROJECT_IMAGE_UPLOAD_TTL_MINUTES: 1
      SOCKET_TICKET_TTL_MINUTES: 1
      PROJECT_IMAGE_PENDING_TIMEOUT_MINUTES: 1
      PENDING_IMAGE_TIMEOUT_JOB_CRON: "0 * * * * *"
      DETECTION_WORKER_MAX_CONCURRENCY: 20
    depends_on:
      icw-rocketmq-init:
        condition: service_completed_successfully
      icw-activity-classification:
        condition: service_started
      icw-activity-reasoning:
        condition: service_started
      icw-activity-summary:
        condition: service_started
    networks:
      - icw-docker-network

  # icw.activity.api 服务
  icw-core-api:
    image: minmuslin/icw_core_api:latest
    container_name: icw.core.api
    restart: unless-stopped
    environment:
      GIN_MODE: release
      ICW_CORE_API_ADDR: 0.0.0.0:8000
      ICW_CORE_BIZ_ADDR: icw-core-biz:8001
      ROCKETMQ_NAMESRV_ADDR: 47.76.71.221:9876
      ROCKETMQ_PROJECT_EVENT_TOPIC: ICW_PROJECT_EVENT
      ROCKETMQ_CONSUMER_GROUP: icw_core_api_ws_dispatcher
    depends_on:
      icw-rocketmq-init:
        condition: service_completed_successfully
      icw-core-biz:
        condition: service_started
    ports:
      - 8000:8000
    networks:
      - icw-docker-network

networks:
  # icw.docker.network 服务
  icw-docker-network:
    driver: bridge
