syntax = "proto3";

package icw.activity.reasoning;

option go_package = "icw_common/gen/activity/reasoning;reasoningpb";

import "core/common.proto";

// Start 请求结构体
message StartRequest {
  string task_uuid = 1;
  .icw.core.common.DetectionTaskCode.Value task_code = 2;
  uint64 user_id = 3;
  uint64 project_id = 4;
  string image_uuid = 5;
}

// Start 响应结构体
message StartResponse {}

// 推理能力 RPC 服务
service ReasoningService {
  // 启动推理任务
  rpc Start(StartRequest) returns (StartResponse);
}
