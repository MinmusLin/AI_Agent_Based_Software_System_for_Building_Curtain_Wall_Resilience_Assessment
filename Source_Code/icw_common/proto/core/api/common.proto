syntax = "proto3";

package icw.core.api;

option go_package = "icw_common/gen/core/api;apipb";

import public "core/common.proto";

// 项目信息结构体
message Project {
  string id = 1;
  string name = 2;
  string building_name = 3;
  string building_location = 4;
  uint32 built_year = 5;
  string building_description = 6;
  string known_issues = 7;
  string assessment_goal = 8;
  string thumbnail_url = 9;
  uint32 progress = 10;
  string created_at = 11;
  string updated_at = 12;
}

// 项目列表项结构体
message ProjectListItem {
  string id = 1;
  string name = 2;
  string building_name = 3;
  string building_location = 4;
  string thumbnail_url = 5;
  uint32 progress = 6;
  string created_at = 7;
}

// 项目图像组结构体
message ProjectGroup {
  string id = 1;
  string name = 2;
  string sort_order = 3;
  repeated .icw.core.common.ProjectImage images = 4;
}

// 项目图像上传项结构体
message UploadProjectImageItem {
  string file_name = 1;
  string content_type = 2;
  uint64 size_bytes = 3;
  uint32 width = 4;
  uint32 height = 5;
  string metadata = 6;
}

// 项目图像状态变化 WebSocket 消息结构体
message ProjectImageStatusChangedMessage {
  string type = 1;
  string project_id = 2;
  .icw.core.common.ProjectImage image = 3;
}
