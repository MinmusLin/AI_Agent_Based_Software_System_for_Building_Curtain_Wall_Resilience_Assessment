syntax = "proto3";

package icw.core.api;

option go_package = "icw_common/gen/core/api;apipb";

// DeleteAvatar 响应结构体
message DeleteAvatarResponse {}

// GetAvatar 响应结构体
message GetAvatarResponse {
  string avatar_url = 1;
  string avatar_type = 2;
}

// UploadAvatar 响应结构体
message UploadAvatarResponse {
  string upload_url = 1;
}
