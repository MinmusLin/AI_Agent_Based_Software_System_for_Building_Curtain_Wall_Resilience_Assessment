syntax = "proto3";

package icw.core.common;

option go_package = "icw_common/gen/core/common;commonpb";

// 项目状态
message ProjectStatus {
  enum Value {
    // 未知
    Unknown = 0;
    // 进行中
    Active = 1;
    // 已完成
    Completed = 2;
    // 已删除
    Deleted = 3;
  }
}

// 项目进度
message ProjectProgress {
  enum Value {
    // 项目初始化完成，当前项目基础信息阶段
    InitializationFinished = 0;
    // 项目基础信息完成，当前图像资产构建阶段
    ProfileFinished = 1;
    // 图像资产构建完成，当前 Agent 智能检测阶段
    AssetsFinished = 2;
    // Agent 智能检测完成，当前人工复核确认阶段
    DetectionFinished = 3;
    // 人工复核确认完成，当前评估报告生成阶段
    ReviewFinished = 4;
    // 评估报告生成完成，当前项目已完成
    ReportFinished = 5;
  }
}

// 项目图像状态
message ProjectImageStatus {
  enum Value {
    // 未知
    Unknown = 0;
    // 上传中
    Pending = 1;
    // 上传成功
    Uploaded = 2;
    // 上传失败
    Failed = 3;
  }
}

// 项目图像检测主任务状态
message ProjectDetectionTaskStatus {
  enum Value {
    // 未知
    Unknown = 0;
    // 等待中
    Pending = 1;
    // 分类中
    Classifying = 2;
    // 检测中
    Detecting = 3;
    // 总结中
    Summarizing = 4;
    // 成功
    Succeeded = 5;
    // 失败
    Failed = 6;
  }
}

// 项目图像检测子任务状态
message ProjectDetectionSubTaskStatus {
  enum Value {
    // 未知
    Unknown = 0;
    // 等待中
    Pending = 1;
    // 成功
    Succeeded = 2;
    // 失败
    Failed = 3;
  }
}

// 用户信息结构体
message User {
  uint64 id = 1;
  string email = 2;
  string name = 3;
}

// 项目图像结构体
message ProjectImage {
  string uuid = 1;
  string file_name = 2;
  string content_type = 3;
  uint64 size_bytes = 4;
  uint32 width = 5;
  uint32 height = 6;
  string metadata = 7;
  ProjectImageStatus.Value status = 8;
  string thumbnail_url = 9;
  string uploaded_at = 10;
  string created_at = 11;
}

// 项目图像上传结果结构体
message UploadProjectImageResult {
  ProjectImage image = 1;
  string original_upload_url = 2;
  string thumbnail_upload_url = 3;
}

// 项目图像检测节点状态结构体
message ProjectDetectionNodeStatus {
  string node_code = 1;
  string sub_task_uuid = 2;
  ProjectDetectionSubTaskStatus.Value sub_status = 3;
}

// 项目图像检测任务状态结构体
message ProjectDetectionStatus {
  string image_uuid = 1;
  string main_task_uuid = 2;
  ProjectDetectionTaskStatus.Value main_status = 3;
  ProjectDetectionNodeStatus classification_status = 4;
  repeated ProjectDetectionNodeStatus detection_status = 5;
  ProjectDetectionNodeStatus summary_status = 6;
}

// 项目图像金属锈蚀检测区域结构体
message ProjectDetectionCorrosionRegion {
  uint32 id = 1;
  double confidence = 2;
  repeated double bbox_xyxy = 3;
  uint64 mask_pixels = 4;
  double mask_ratio = 5;
}

// 项目图像金属锈蚀检测结果结构体
message ProjectDetectionCorrosionResult {
  string task_uuid = 1;
  ProjectDetectionSubTaskStatus.Value status = 2;
  bool has_corrosion = 3;
  uint32 corrosion_count = 4;
  double max_confidence = 5;
  double average_confidence = 6;
  uint64 corrosion_pixels = 7;
  double corrosion_ratio = 8;
  repeated ProjectDetectionCorrosionRegion regions = 9;
  double runtime_seconds = 10;
  map<string, string> artifacts = 11;
  string started_at = 12;
  string finished_at = 13;
}

// 项目图像石材裂缝检测区域结构体
message ProjectDetectionCrackRegion {
  uint32 id = 1;
  repeated double bbox_xyxy = 2;
  uint64 mask_pixels = 3;
  double mask_ratio = 4;
}

// 项目图像石材裂缝检测结果结构体
message ProjectDetectionCrackResult {
  string task_uuid = 1;
  ProjectDetectionSubTaskStatus.Value status = 2;
  bool has_crack = 3;
  uint32 crack_count = 4;
  uint64 crack_pixels = 5;
  double crack_ratio = 6;
  repeated ProjectDetectionCrackRegion regions = 7;
  double runtime_seconds = 8;
  map<string, string> artifacts = 9;
  string started_at = 10;
  string finished_at = 11;
}

// 项目图像石材污渍检测区域结构体
message ProjectDetectionStainRegion {
  uint32 id = 1;
  double confidence = 2;
  repeated double bbox_xyxy = 3;
  uint32 region_width = 4;
  uint32 region_height = 5;
  uint64 stain_pixels = 6;
  double stain_ratio = 7;
}

// 项目图像石材污渍检测结果结构体
message ProjectDetectionStainResult {
  string task_uuid = 1;
  ProjectDetectionSubTaskStatus.Value status = 2;
  bool has_stain = 3;
  uint32 stain_count = 4;
  double average_stain_ratio = 5;
  double max_stain_ratio = 6;
  repeated ProjectDetectionStainRegion regions = 7;
  double runtime_seconds = 8;
  map<string, string> artifacts = 9;
  string started_at = 10;
  string finished_at = 11;
}

// 项目图像玻璃平整度检测区域结构体
message ProjectDetectionFlatnessRegion {
  uint32 id = 1;
  repeated double bbox_xyxy = 2;
  bool edge_uneven_detected = 3;
  bool line_uneven_detected = 4;
  bool gradient_uneven_detected = 5;
  bool frequency_uneven_detected = 6;
  uint64 edge_count = 7;
  double laplacian_variance = 8;
  uint64 line_count = 9;
  double angle_std = 10;
  double gradient_mean = 11;
  double gradient_std = 12;
  double frequency_min = 13;
  double frequency_max = 14;
}

// 项目图像玻璃平整度检测结果结构体
message ProjectDetectionFlatnessResult {
  string task_uuid = 1;
  ProjectDetectionSubTaskStatus.Value status = 2;
  string result = 3;
  uint32 uneven_count = 4;
  repeated ProjectDetectionFlatnessRegion regions = 5;
  double runtime_seconds = 6;
  map<string, string> artifacts = 7;
  string started_at = 8;
  string finished_at = 9;
}

// 项目图像玻璃爆裂检测结果结构体
message ProjectDetectionSpallingResult {
  string task_uuid = 1;
  ProjectDetectionSubTaskStatus.Value status = 2;
  bool has_spalling = 3;
  double confidence = 4;
  double runtime_seconds = 5;
  map<string, string> artifacts = 6;
  string started_at = 7;
  string finished_at = 8;
}

// 项目图像检测总结结果结构体
message ProjectDetectionSummaryResult {
  string task_uuid = 1;
  ProjectDetectionSubTaskStatus.Value status = 2;
  string result_json = 3;
  string started_at = 4;
  string finished_at = 5;
}
