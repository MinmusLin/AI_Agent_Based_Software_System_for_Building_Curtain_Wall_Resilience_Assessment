syntax = "proto3";

package icw.core.biz;

option go_package = "icw_common/gen/core/biz;bizpb";

// DeleteAvatar 请求结构体
message DeleteAvatarRequest {
  uint64 user_id = 2;
  string email = 3;
}

// DeleteAvatar 响应结构体
message DeleteAvatarResponse {}

// GetAvatar 请求结构体
message GetAvatarRequest {
  uint64 user_id = 2;
  string email = 3;
}

// GetAvatar 响应结构体
message GetAvatarResponse {
  string avatar_url = 1;
  string avatar_type = 2;
}

// UploadAvatar 请求结构体
message UploadAvatarRequest {
  uint64 user_id = 2;
  string email = 3;
  string content_type = 4;
}

// UploadAvatar 响应结构体
message UploadAvatarResponse {
  string upload_url = 1;
}

service UserService {
  rpc DeleteAvatar(DeleteAvatarRequest) returns (DeleteAvatarResponse);
  rpc GetAvatar(GetAvatarRequest) returns (GetAvatarResponse);
  rpc UploadAvatar(UploadAvatarRequest) returns (UploadAvatarResponse);
}
