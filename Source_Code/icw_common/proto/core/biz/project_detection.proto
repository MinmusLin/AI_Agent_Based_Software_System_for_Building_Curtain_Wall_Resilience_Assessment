syntax = "proto3";

package icw.core.biz;

option go_package = "icw_common/gen/core/biz;bizpb";

import "activity/common.proto";
import "core/biz/common.proto";
import "core/common.proto";

// GetImageDetectionResult 请求结构体
message GetImageDetectionResultRequest {
  uint64 user_id = 1;
  uint64 project_id = 2;
  string image_uuid = 3;
}

// GetImageDetectionResult 响应结构体
message GetImageDetectionResultResponse {
  .icw.core.common.ProjectImage image = 1;
  string original_url = 2;
  .icw.core.common.ProjectDetectionStatus status = 3;
  repeated .icw.activity.DetectionTaskCode.Value task_codes = 4;
  .icw.core.common.ProjectDetectionCorrosionResult corrosion_result = 5;
  .icw.core.common.ProjectDetectionCrackResult crack_result = 6;
  .icw.core.common.ProjectDetectionStainResult stain_result = 7;
  .icw.core.common.ProjectDetectionFlatnessResult flatness_result = 8;
  .icw.core.common.ProjectDetectionSpallingResult spalling_result = 9;
  .icw.core.common.ProjectDetectionSummaryResult summary_result = 10;
}

// GetProjectDetectionTasks 请求结构体
message GetProjectDetectionTasksRequest {
  uint64 user_id = 1;
  uint64 project_id = 2;
}

// GetProjectDetectionTasks 响应结构体
message GetProjectDetectionTasksResponse {
  repeated .icw.core.common.ProjectDetectionStatus tasks = 1;
}

// ReportClassificationResult 请求结构体
message ReportClassificationResultRequest {
  string task_uuid = 1;
  string image_uuid = 2;
  .icw.activity.DetectionStatus.Value status = 3;
  repeated .icw.activity.DetectionTaskCode.Value task_codes = 4;
  string error_message = 5;
}

// ReportClassificationResult 响应结构体
message ReportClassificationResultResponse {}

// ReportDetectionSummaryResult 请求结构体
message ReportDetectionSummaryResultRequest {
  string task_uuid = 1;
  string image_uuid = 2;
  .icw.activity.DetectionStatus.Value status = 3;
  string result_json = 4;
  string error_message = 5;
}

// ReportDetectionSummaryResult 响应结构体
message ReportDetectionSummaryResultResponse {}

// ReportReasoningResult 请求结构体
message ReportReasoningResultRequest {
  .icw.activity.DetectionTaskCode.Value task_code = 1;
  string task_uuid = 2;
  string image_uuid = 3;
  .icw.activity.DetectionStatus.Value status = 4;
  string result_json = 5;
  repeated ReasoningArtifactUploadResult artifacts = 6;
  string error_message = 7;
}

// ReportReasoningResult 响应结构体
message ReportReasoningResultResponse {}

// RetryProjectDetection 请求结构体
message RetryProjectDetectionRequest {
  uint64 user_id = 1;
  uint64 project_id = 2;
}

// RetryProjectDetection 响应结构体
message RetryProjectDetectionResponse {
  uint32 task_count = 1;
}

// StartProjectDetection 请求结构体
message StartProjectDetectionRequest {
  uint64 user_id = 1;
  uint64 project_id = 2;
}

// StartProjectDetection 响应结构体
message StartProjectDetectionResponse {
  uint32 task_count = 1;
}

// 智能检测 RPC 服务
service ProjectDetectionService {
  // 获取图像检测结果
  rpc GetImageDetectionResult(GetImageDetectionResultRequest) returns (GetImageDetectionResultResponse);
  // 获取项目检测任务列表
  rpc GetProjectDetectionTasks(GetProjectDetectionTasksRequest) returns (GetProjectDetectionTasksResponse);
  // 上报图像检测分类结果
  rpc ReportClassificationResult(ReportClassificationResultRequest) returns (ReportClassificationResultResponse);
  // 上报图像检测总结结果
  rpc ReportDetectionSummaryResult(ReportDetectionSummaryResultRequest) returns (ReportDetectionSummaryResultResponse);
  // 上报图像检测推理结果
  rpc ReportReasoningResult(ReportReasoningResultRequest) returns (ReportReasoningResultResponse);
  // 重试项目智能检测
  rpc RetryProjectDetection(RetryProjectDetectionRequest) returns (RetryProjectDetectionResponse);
  // 启动项目智能检测
  rpc StartProjectDetection(StartProjectDetectionRequest) returns (StartProjectDetectionResponse);
}
