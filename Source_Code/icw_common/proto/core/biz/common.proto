syntax = "proto3";

package icw.core.biz;

option go_package = "icw_common/gen/core/biz;bizpb";

import public "core/common.proto";

// 邮箱验证码业务场景
message EmailCodeScene {
  enum Value {
    // 未知
    Unknown = 0;
    // 注册账号
    Register = 1;
    // 登录账号
    Login = 2;
    // 重置密码
    Reset = 3;
  }
}

// 登录方式
message LoginScene {
  enum Value {
    // 未知
    Unknown = 0;
    // 密码登录
    Password = 1;
    // 邮箱验证码登录
    Email = 2;
  }
}

// 邮件发送状态
message EmailSendStatus {
  enum Value {
    // 未知
    Unknown = 0;
    // 成功
    Success = 1;
    // 失败
    Failed = 2;
  }
}

// 项目信息结构体
message Project {
  uint64 id = 1;
  string name = 2;
  string building_name = 3;
  string building_location = 4;
  uint32 built_year = 5;
  string building_description = 6;
  string known_issues = 7;
  string assessment_goal = 8;
  string thumbnail_url = 9;
  .icw.core.common.ProjectProgress.Value progress = 10;
  string created_at = 11;
  string updated_at = 12;
}

// 项目列表项结构体
message ProjectListItem {
  uint64 id = 1;
  string name = 2;
  string building_name = 3;
  string building_location = 4;
  string thumbnail_url = 5;
  .icw.core.common.ProjectProgress.Value progress = 6;
  string created_at = 7;
}

// 项目图像组结构体
message ProjectGroup {
  uint64 id = 1;
  string name = 2;
  string sort_order = 3;
  repeated .icw.core.common.ProjectImage images = 4;
}

// 项目图像上传项结构体
message UploadProjectImageItem {
  string file_name = 1;
  string content_type = 2;
  uint64 size_bytes = 3;
  uint32 width = 4;
  uint32 height = 5;
  string metadata = 6;
  string image_uuid = 7;
  string original_key = 8;
  string thumbnail_key = 9;
  string original_upload_url = 10;
  string thumbnail_upload_url = 11;
}

// 图像检测推理产物上传结果结构体
message ReasoningArtifactUploadResult {
  string name = 1;
  bool uploaded = 2;
  string sha256 = 3;
}
