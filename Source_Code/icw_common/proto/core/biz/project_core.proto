syntax = "proto3";

package icw.core.biz;

option go_package = "icw_common/gen/core/biz;bizpb";

import "core/biz/common.proto";
import "core/common.proto";

// AdvanceProject 请求结构体
message AdvanceProjectRequest {
  uint64 user_id = 1;
  uint64 project_id = 2;
  .icw.core.common.ProjectProgress.Value from_progress = 3;
  .icw.core.common.ProjectProgress.Value to_progress = 4;
}

// AdvanceProject 响应结构体
message AdvanceProjectResponse {}

// CheckProjectAccess 请求结构体
message CheckProjectAccessRequest {
  uint64 user_id = 1;
  uint64 project_id = 2;
}

// CheckProjectAccess 响应结构体
message CheckProjectAccessResponse {
  uint64 project_id = 1;
  .icw.core.common.ProjectProgress.Value progress = 2;
  .icw.core.common.ProjectStatus.Value status = 3;
}

// CreateProject 请求结构体
message CreateProjectRequest {
  uint64 user_id = 1;
}

// CreateProject 响应结构体
message CreateProjectResponse {
  Project project = 1;
}

// DeleteProject 请求结构体
message DeleteProjectRequest {
  uint64 user_id = 1;
  uint64 project_id = 2;
}

// DeleteProject 响应结构体
message DeleteProjectResponse {
  repeated ProjectListItem active_projects = 1;
  repeated ProjectListItem completed_projects = 2;
}

// GetProjectDashboard 请求结构体
message GetProjectDashboardRequest {
  uint64 user_id = 1;
}

// GetProjectDashboard 响应结构体
message GetProjectDashboardResponse {
  uint64 active_project_count = 1;
  uint64 completed_project_count = 2;
  uint64 total_project_count = 3;
  uint64 uploaded_image_count = 4;
  uint64 project_group_count = 5;
  uint64 minio_object_count = 6;
  uint64 detection_task_count = 7;
  uint64 corrosion_detection_task_count = 8;
  uint64 crack_detection_task_count = 9;
  uint64 stain_detection_task_count = 10;
  uint64 flatness_detection_task_count = 11;
  uint64 spalling_detection_task_count = 12;
  uint64 detection_summary_task_count = 13;
  uint64 report_task_count = 14;
  uint64 minio_bucket_used_bytes = 15;
  uint64 minio_bucket_quota_bytes = 16;
  uint64 minio_bucket_remaining_bytes = 17;
  bool minio_storage_available = 18;
}

// ListProjects 请求结构体
message ListProjectsRequest {
  uint64 user_id = 1;
}

// ListProjects 响应结构体
message ListProjectsResponse {
  repeated ProjectListItem active_projects = 1;
  repeated ProjectListItem completed_projects = 2;
}

// 项目核心 RPC 服务
service ProjectCoreService {
  // 项目进度流转
  rpc AdvanceProject(AdvanceProjectRequest) returns (AdvanceProjectResponse);
  // 校验项目访问权限
  rpc CheckProjectAccess(CheckProjectAccessRequest) returns (CheckProjectAccessResponse);
  // 创建项目
  rpc CreateProject(CreateProjectRequest) returns (CreateProjectResponse);
  // 删除项目
  rpc DeleteProject(DeleteProjectRequest) returns (DeleteProjectResponse);
  // 获取项目工作台统计
  rpc GetProjectDashboard(GetProjectDashboardRequest) returns (GetProjectDashboardResponse);
  // 获取项目列表
  rpc ListProjects(ListProjectsRequest) returns (ListProjectsResponse);
}
