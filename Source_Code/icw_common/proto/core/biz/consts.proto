syntax = "proto3";

package icw.core.biz;

option go_package = "icw_common/gen/core/biz;bizpb";

// 邮箱验证码业务场景
message EmailCodeScene {
  enum Value {
    // 未知
    Unknown = 0;
    // 注册账号
    Register = 1;
    // 登录账号
    Login = 2;
    // 重置密码
    Reset = 3;
  }
}

// 登录方式
message LoginScene {
  enum Value {
    // 未知
    Unknown = 0;
    // 密码登录
    Password = 1;
    // 邮箱验证码登录
    Email = 2;
  }
}

// 邮件发送状态
message EmailSendStatus {
  enum Value {
    // 未知
    Unknown = 0;
    // 成功
    Success = 1;
    // 失败
    Failed = 2;
  }
}

// 项目状态
message ProjectStatus {
  enum Value {
    // 未知
    Unknown = 0;
    // 进行中
    Active = 1;
    // 已完成
    Completed = 2;
    // 已删除
    Deleted = 3;
  }
}

// 项目进度
message ProjectProgress {
  enum Value {
    // 项目初始化完成，当前项目基础信息阶段
    InitializationFinished = 0;
    // 项目基础信息完成，当前图像资产构建阶段
    ProfileFinished = 1;
    // 图像资产构建完成，当前 Agent 智能检测阶段
    AssetsFinished = 2;
    // Agent 智能检测完成，当前人工复核确认阶段
    DetectionFinished = 3;
    // 人工复核确认完成，当前评估报告生成阶段
    ReviewFinished = 4;
    // 评估报告生成完成，当前项目已完成
    ReportFinished = 5;
  }
}

// 项目图像状态
message ProjectImageStatus {
  enum Value {
    // 未知
    Unknown = 0;
    // 上传中
    Pending = 1;
    // 上传成功
    Uploaded = 2;
    // 上传失败
    Failed = 3;
  }
}

// 项目图像检测主任务状态
message ProjectDetectionTaskStatus {
  enum Value {
    // 未知
    Unknown = 0;
    // 等待中
    Pending = 1;
    // 分类中
    Classifying = 2;
    // 检测中
    Detecting = 3;
    // 总结中
    Summarizing = 4;
    // 成功
    Succeeded = 5;
    // 失败
    Failed = 6;
  }
}

// 项目图像检测子任务状态
message ProjectDetectionSubTaskStatus {
  enum Value {
    // 未知
    Unknown = 0;
    // 等待中
    Pending = 1;
    // 检测中
    Running = 2;
    // 成功
    Succeeded = 3;
    // 失败
    Failed = 4;
  }
}
