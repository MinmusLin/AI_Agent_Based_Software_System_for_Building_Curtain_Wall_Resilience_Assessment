\def\tongjiinfoabstract{本毕业设计面向建筑幕墙人工巡检效率低、主观性强、难以处理海量图像等问题，设计并实现了一套基于 AI Agent 的建筑幕墙韧性评估软件系统。系统亮点包括面向建筑幕墙多材质图像的 Agent 自主任务调度方法和 LLM 分层信息整合策略：前者由分类 Agent 根据图像内容自主判断需要执行的原子检测能力，并将开放语义判断约束为工程系统可消费的任务代码；后者将大语言模型从简单文本生成工具扩展为“路由、压缩、汇总”的智能节点，有效解决了海量数据直接输入 LLM 模型带来的上下文过载和重点淹没问题。作者现已完成原型系统的部署和实际场景试用，获得同济大学土木工程学院科研团队认可，为建筑幕墙数字运维提供了一种兼具工程可实施性和智能决策能力的解决方案。}
