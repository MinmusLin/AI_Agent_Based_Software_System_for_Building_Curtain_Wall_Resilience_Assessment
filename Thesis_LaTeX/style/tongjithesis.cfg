\def\tongjiinfoabstract{本毕业设计面向建筑幕墙韧性评估中人工巡检效率低、结果主观、图像数据难以规模化处理和报告难以系统生成的问题，设计并实现一套基于 AI Agent 的软件系统。系统以项目级图像资产管理为基础，由 Agent 自主判断每张图像需要执行的原子检测能力，并通过分层信息整合策略先生成单图总结，再融合为项目级评估报告。工程上采用前后端分离、gRPC、RocketMQ、WebSocket、MySQL、Redis 与 MinIO 等技术，形成可部署、可追踪、可扩展的端到端原型。本文重点在于 Agent 赋能工程链路，而非单个视觉模型本身。}
