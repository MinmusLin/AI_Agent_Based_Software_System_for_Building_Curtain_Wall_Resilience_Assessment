name: Release icw_core_api

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - Source_Code/icw_core_api/**
      - Source_Code/icw_common/**
      - .github/workflows/release-icw-server.yml
      - .github/workflows/release-icw-core-api.yml

jobs:
  release:
    permissions:
      contents: write
    uses: ./.github/workflows/release-icw-server.yml
    with:
      service: icw_core_api
